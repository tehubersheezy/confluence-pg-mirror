[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-pg-mirror"
version = "0.1.0"
description = "Read-only mirror of Confluence Data Center spaces into PostgreSQL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "confluence-pg-mirror contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Database",
]
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.1,<4",
  "lxml>=5.0",
]

[project.optional-dependencies]
# Use the operating system trust store (macOS Keychain) for corporate CAs.
truststore = ["truststore>=0.9"]
# Claude extraction (confex extract with a model). Pure-Python wheels plus prebuilt
# pydantic-core/jiter wheels for macOS; no compiler or conda needed.
model = ["anthropic>=2.3,<3"]
dev = ["pytest>=8", "ruff>=0.5", "anthropic>=2.3,<3"]

[project.scripts]
confex = "confluence_mirror.confex:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
confluence_mirror = ["migrations/*.sql"]
"confluence_mirror.extraction" = [
  "registry/schemas/*.json",
  "registry/profiles/*.json",
  "prompts/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a PostgreSQL server (auto-started from initdb/pg_ctl on PATH, or CONFLUENCE_MIRROR_TEST_DSN)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
