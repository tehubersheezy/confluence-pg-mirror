# confluence-pg-mirror configuration template.
# Copy to ./config.toml (git-ignored) or pass --config PATH.
# The PAT is NEVER read from this file: set CONFLUENCE_PAT in the environment or .env.

[confluence]
# Base URL including any context path, e.g. https://confluence.example.com/confluence
base_url = "https://confluence.example.com"
# Seconds per HTTP request.
timeout = 60
# Page size for paginated REST calls (Confluence caps this server-side).
page_size = 50
# Retries for 429/5xx/network errors, with exponential backoff (honors Retry-After).
max_retries = 5
backoff_base = 1.0
# Client-side rate limit, applied to every request including retries. 0 = unlimited.
# A 429 halves it for the rest of the run.
max_requests_per_second = 5.0
# TLS verification is always on. To trust a corporate CA, either:
#   ca_bundle = "/Users/you/certs/corp-root.pem"
# or use the macOS Keychain via the optional `truststore` extra:
#   use_system_truststore = true
use_system_truststore = false

[database]
# libpq connection string; prefer ~/.pgpass or PG* env vars for passwords.
dsn = "postgresql:///confluence_mirror"

[sync]
# Spaces synced by `confex sync --all`.
spaces = ["DEMO"]
# Content types to mirror: "page" and optionally "blogpost".
content_types = ["page"]
# Abort the deletion phase if more than this fraction of known pages vanished
# from a listing (protects against permission glitches wiping the mirror).
max_delete_fraction = 0.5
# Overlap window (minutes) applied to the incremental cursor for CQL queries.
incremental_overlap_minutes = 1440
# Re-fetch labels/properties/restrictions/attachments for unchanged pages
# during incremental sync (slower, catches metadata-only edits).
refresh_unchanged_metadata = false
# Space listing: "scan" (/rest/api/content/scan, DC 7.18+; blog posts need 8.3+),
# "legacy" (offset paging on /rest/api/content) or "auto" (scan, falling back to legacy).
listing = "auto"
# Pages per listing request (scan accepts up to 1000; CQL listings cap at 200).
listing_page_size = 200
# Changed pages fetched per request with bodies and metadata (the server caps this at 50).
body_batch_size = 50
# Content properties:
#   "known" - the keys already mirrored for the space, inside the batch requests (free);
#   "all"   - every key, one extra request per fetched page (discovers keys and removals);
#   "none"  - leave stored properties alone;
#   a list  - those keys, inside the batch requests, e.g. ["owner", "review-date"].
# Discover keys once with: confex sync --space KEY --reconcile --properties all
page_properties = "known"
# Optional: download attachment binaries to this directory (metadata is always mirrored).
# attachment_dir = "./attachments"
# Body representations fetched per page (storage is required).
# representations = ["storage", "export_view", "view"]

# ---------------------------------------------------------------------------------------
# confex extraction. Everything below is optional; the defaults never send text anywhere.
# ---------------------------------------------------------------------------------------

[model]
# Claude through the official Anthropic SDK: pip install 'confluence-pg-mirror[model]'.
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "medium"             # low | medium | high
max_output_tokens = 16000      # leaves room for adaptive thinking plus the JSON result
endpoint = "https://api.anthropic.com"
# The key is read from this environment variable; never put a key in this file.
api_key_env = "ANTHROPIC_API_KEY"
timeout_seconds = 120
concurrency = 2

[privacy]
# Model egress stays off until your organization has approved it. A CLI flag cannot
# override this. Record the approval (ticket, policy ID) when you turn it on.
egress_approved = false
approval_reference = ""
# Restrict egress to these spaces (empty = any space the mirror holds).
allowed_spaces = []
allowed_endpoints = ["https://api.anthropic.com"]
# Keep the exact request and final output of every model call (needed for full lineage).
retain_requests = true
# Extra redaction rules, applied before token estimation and transmission. Credentials,
# AWS access keys, private keys and bearer tokens are redacted by default.
# redact_patterns = [{ name = "ticket", pattern = "TCK-[0-9]+" }]

[extraction]
# default_profile = "host_inventory@1.0.0"
# Extra schema/profile directories (each with schemas/ and profiles/ subdirectories).
# registry_dirs = ["./my-registry"]
extractor = "auto"             # auto | rules | model

[budgets]
# Hard ceilings per run; unset means unlimited. A monetary limit needs a dated price.
# max_requests = 200
# max_input_tokens = 2000000
# max_output_tokens = 1000000
# max_cost_usd = 5.0
per_item_retries = 1           # semantic repair attempts per unit

# Dated provider prices (USD per million tokens). Without one, costs report as unknown.
# Check current prices before relying on these; they change.
# [pricing."claude-haiku-5-5"]
# input_per_mtok = 0.10
# output_per_mtok = 0.50
# as_of = "2026-10-06"
